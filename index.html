<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam Dispatch | Live Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif; background-color: #f4f1ea; color: #1a1a1a; }
        .headline { font-family: 'Playfair Display', serif; }
        .newspaper-border { border-top: 4px double #000; border-bottom: 1px solid #000; }
        .news-card { background: white; border: 1px solid #d1d1d1; margin-bottom: 2rem; padding: 1.5rem; transition: 0.3s; }
        .news-card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinning { animation: spin 1s linear infinite; display: inline-block; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loader" class="fixed inset-0 bg-white/90 z-50 flex flex-col items-center justify-center hidden">
        <span class="text-4xl spinning mb-4">⏳</span>
        <h2 class="headline text-xl">PRINTING LATEST EDITION...</h2>
    </div>

    <header class="max-w-3xl mx-auto text-center mb-12">
        <div class="newspaper-border py-6">
            <h1 class="text-5xl md:text-7xl headline font-black mb-2">AMSTERDAM DISPATCH</h1>
            <p class="uppercase tracking-widest text-sm font-bold">Live Intelligence • <span id="currentDate"></span></p>
        </div>
        <button onclick="fetchNews()" id="refreshBtn" class="mt-6 px-8 py-2 border-2 border-black font-bold hover:bg-black hover:text-white transition-all uppercase text-xs tracking-tighter">
            Update News Feed
        </button>
    </header>

    <main id="newsFeed" class="max-w-3xl mx-auto">
        <div class="text-center text-gray-500 py-20 italic">
            Press "Update" to fetch today's headlines.
        </div>
    </main>

    <footer class="text-center py-10 border-t border-gray-300 max-w-3xl mx-auto mt-12 text-xs text-gray-500 uppercase">
        <p id="lastUpdated"></p>
    </footer>

    <script>
        async function fetchNews() {
            const loader = document.getElementById('loader');
            const feed = document.getElementById('newsFeed');
            loader.classList.remove('hidden');

            try {
                const response = await fetch("https://amsterdam-news-dispatch.onrender.com/api/fetch-news", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                const data = await response.json();
                const text = data.content[0].text;
                
                // Simplified Parser: Just find everything between dashes
                const items = text.split('---').filter(i => i.trim().length > 30);
                
                feed.innerHTML = items.map(item => {
                    // Extract data using simple regex
                    const title = item.match(/TITLE:\s*(.*)/i)?.[1] || "Untitled News";
                    const desc = item.match(/DESCRIPTION:\s*(.*)/i)?.[1] || "";
                    const source = item.match(/SOURCE:\s*(.*)/i)?.[1] || "Unknown Source";
                    const url = item.match(/https?:\/\/[^\s]+/)?.[0] || "#";
                    const category = item.match(/CATEGORY:\s*(.*)/i)?.[1] || "General";

                    return `
                        <article class="news-card">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-red-700">${category}</span>
                            <h2 class="headline text-2xl my-2 leading-tight">
                                <a href="${url}" target="_blank" class="hover:text-red-800 underline decoration-1 underline-offset-4">${title}</a>
                            </h2>
                            <p class="text-sm leading-relaxed text-gray-700 mb-4">${desc}</p>
                            <div class="flex justify-between items-center text-[10px] font-bold uppercase text-gray-500">
                                <span>Source: ${source}</span>
                                <a href="${url}" target="_blank" class="text-black">Read Story →</a>
                            </div>
                        </article>
                    `;
                }).join('');

                document.getElementById('lastUpdated').textContent = "Last Update: " + new Date().toLocaleTimeString();
            } catch (e) {
                alert("The news press is jammed (Server waking up). Try again in 10 seconds!");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function setDate() {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-GB', { 
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' 
            }).toUpperCase();
        }
        setDate();
    </script>
</body>
</html>
