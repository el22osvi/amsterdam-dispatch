<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam Dispatch | Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif; background-color: #f4f1ea; color: #1a1a1a; }
        .headline { font-family: 'Playfair Display', serif; }
        .news-card { background: white; border: 1px solid #d1d1d1; padding: 1.5rem; margin-bottom: 2rem; }
    </style>
</head>
<body class="p-4">

    <header class="max-w-2xl mx-auto text-center py-10">
        <h1 class="text-5xl headline font-black border-b-4 border-black pb-4">AMSTERDAM DISPATCH</h1>
        <button onclick="fetchNews()" id="refreshBtn" class="mt-6 px-6 py-2 border-2 border-black font-bold hover:bg-black hover:text-white transition-all">
            UPDATE DISPATCH
        </button>
    </header>

    <main id="newsFeed" class="max-w-2xl mx-auto">
        <p class="text-center italic text-gray-500">Press update for today's intelligence...</p>
    </main>

    <script>
        async function fetchNews() {
            const feed = document.getElementById('newsFeed');
            const btn = document.getElementById('refreshBtn');
            btn.textContent = "PRINTING...";
            
            try {
                const response = await fetch("https://amsterdam-news-dispatch.onrender.com/api/fetch-news", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                const data = await response.json();
                const text = data.content[0].text;
                
                // Split by the separator and filter out empty bits
                const items = text.split('---').filter(i => i.includes('TITLE:'));
                
                feed.innerHTML = items.map(item => {
                    const title = item.match(/TITLE:\s*(.*)/)?.[1] || "Untitled";
                    const desc = item.match(/DESCRIPTION:\s*(.*)/)?.[1] || "";
                    const url = item.match(/https?:\/\/[^\s\n]+/)?.[0] || "#";
                    const source = item.match(/SOURCE:\s*(.*)/)?.[1] || "News Desk";
                    const cat = item.match(/CATEGORY:\s*(.*)/)?.[1] || "LIVE";

                    return `
                        <div class="news-card fade-in">
                            <span class="text-red-700 font-bold text-[10px] tracking-widest uppercase">${cat}</span>
                            <h2 class="headline text-2xl my-2 leading-tight">
                                <a href="${url.replace(/[)]/g, '')}" target="_blank" class="hover:underline">${title}</a>
                            </h2>
                            <p class="text-sm text-gray-700 mb-4">${desc}</p>
                            <div class="text-[10px] font-bold uppercase text-gray-400">Source: ${source}</div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                alert("The server is still waking up! Give it 20 seconds and try again.");
            } finally {
                btn.textContent = "UPDATE DISPATCH";
            }
        }
    </script>
</body>
</html>
